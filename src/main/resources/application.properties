# ---------------------------------------------------------------------------
# Microservicio foro-moderacion  (generado con microservicio-arquetipo)
#
# Perfiles disponibles:
#   local   -> H2 en memoria, para desarrollar sin credenciales.
#   oracle  -> esquema FORO en Oracle Autonomous Database.
# ---------------------------------------------------------------------------

spring.application.name=foro-moderacion
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8083}

# Las respuestas de error incluyen el mensaje para facilitar la revision en Postman.
server.error.include-message=always
spring.jackson.serialization.indent-output=true

# Secreto compartido con foro-usuarios para validar el JWT.
foro.jwt.secreto=${FORO_JWT_SECRETO:clave-de-desarrollo-del-foro-de-cubos-no-usar-en-produccion}

# Origenes permitidos por CORS, separados por coma.
foro.cors.origenes=${FORO_CORS_ORIGENES:http://localhost:*}

logging.level.root=INFO
logging.level.com.foro.moderacion=DEBUG

management.endpoints.web.exposure.include=health,info
